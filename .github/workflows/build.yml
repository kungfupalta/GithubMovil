name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon --stacktrace -PgithubClientId=${{ vars.GH_CLIENT_ID }}

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitHubMobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
